services:
  - type: web
    name: xedy-telegram-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.cloud_runner:app --host 0.0.0.0 --port 
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
