name: Telegram 15-Minute Bloomberg Dashboard

on:
  # schedule:
  #   # Runs every 15 minutes: at :00, :15, :30, and :45 of every hour
  #   - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

jobs:
  push-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow python-dotenv

      - name: Run Bloomberg S/R Push (Failover Gate)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8670995678:AAEvTX6Ii222QVCW4AIlRhzQYKbOR-lj06c' }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID || '-1003468917523' }}
          LOCAL_DAEMON_LAST_SEEN: ${{ vars.LOCAL_DAEMON_LAST_SEEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python backend/scripts/run_github_cron_push.py
