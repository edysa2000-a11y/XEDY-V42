name: XEDY Mission Control Scraper (NFP Mode)

on:
  schedule:
    # Run every 15 minutes during trading days (Mon-Fri)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 aiohttp numpy pandas html2image

    - name: Run XEDY Multi-Threaded Scraper
      env:
        AIVENE_API_KEY: ${{ secrets.AIVENE_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        ACTIVE_RISK_PROFILE: "MODERATE"
      run: |
        # Navigating to the backend directory and running the optimized scraper
        cd "backend/scripts" || exit 1
        python scrape_news.py
        
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/news_feed.json
        git commit -m "Auto-update AI Macro Analysis (V42)" || echo "No changes to commit"
        git push origin HEAD:data-feed -f
