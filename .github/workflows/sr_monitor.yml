name: XEDY S/R Real-Time Monitor

on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: xedy-sr-monitor-group
  cancel-in-progress: true

jobs:
  sr-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pillow

      - name: Restore S/R State Cache
        uses: actions/cache@v3
        with:
          path: data/sr_state.json
          key: sr-state-cache-${{ github.run_id }}
          restore-keys: |
            sr-state-cache-

      - name: Run S/R Real-Time Monitor Loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python backend/scripts/run_sr_github_actions.py

      - name: Save S/R State Cache
        uses: actions/cache@v3
        if: always()
        with:
          path: data/sr_state.json
          key: sr-state-cache-${{ github.run_id }}
