name: XEDY Cloud Scraper

on:
  schedule:
    - cron: '*/5 * * * *' # Run every 5 minutes
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Concurrency lock to prevent overlapping runs from queueing up if execution takes over 60s
concurrency:
  group: data-feed-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1 # Shallow clone to speed up checkout significantly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --prefer-binary python-dotenv pandas numpy feedparser pillow html2image jinja2
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Restore State from data-feed branch
        run: |
          git fetch --depth=1 origin data-feed || echo "No previous data-feed branch found."
          git checkout origin/data-feed -- data/ || echo "No previous data directory found."

      - name: Run Cloud News Scraper & S/R Monitor Engine
        timeout-minutes: 6
        env:
          AIVENE_API_KEY: ${{ secrets.AIVENE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python backend/scripts/scrape_news.py || echo "News scraper failed, skipping..."
          python backend/scripts/scrape_oanda_volume.py || echo "Oanda volume scraper failed, skipping..."
          python backend/scripts/scrape_cot.py || echo "COT scraper failed, skipping..."
          python backend/scripts/run_sr_github_actions.py

      - name: Deploy data updates to data-feed branch
        run: |
          git config --global user.name "XEDY Cloud Scraper"
          git config --global user.email "cloud-scraper@xedy.trading"
          
          # Create a separate temporary folder for generated data
          mkdir -p temp_data/data
          cp data/sr_state.json temp_data/data/ || true
          cp data/news_feed.json temp_data/data/ || true
          cp data/claude_forecast.json temp_data/data/ || true
          cp data/qwen_decisions_log.jsonl temp_data/data/ || true
          cp data/self_learning_feedback.json temp_data/data/ || true
          cp data/closed_trades.json temp_data/data/ || true
          cp data/keyword_impact_memory.json temp_data/data/ || true
          cp data/forecast_accuracy_stats.json temp_data/data/ || true
          cp data/oanda_cvd.json temp_data/data/ || true
          cp data/market_ticker.json temp_data/data/ || true
          cp data/embedding_cache.json temp_data/data/ || true
          cp data/cot_data.json temp_data/data/ || true
          
          # Switch to an orphan branch (No History) to prevent git bloat
          git checkout --orphan data-feed-temp
          
          # Clean repository files
          git rm -rf . > /dev/null 2>&1 || true
          rm -rf backend frontend docs models tests .github
          mv temp_data/data .
          rm -rf temp_data
          
          # Commit and force push to overwrite remote branch with zero history
          git add -f data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Deploy cloud news feed and self-learning updates" && git push -f origin data-feed-temp:data-feed)
