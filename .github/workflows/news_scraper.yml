name: XEDY Cloud Scraper

on:
  schedule:
    - cron: '*/1 * * * *' # Run every 1 minute
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Step 1: Caching dependencies enabled

      - name: Install dependencies
        run: |
          pip install python-dotenv pandas numpy feedparser

      - name: Run Cloud News Scraper
        env:
          AIVENE_API_KEY: ${{ secrets.AIVENE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python backend/scripts/scrape_news.py

      - name: Run Cloud Self-Learning Feedback Loop
        run: |
          python backend/scripts/adaptive_self_learning.py

      - name: Deploy data updates to data-feed branch
        run: |
          git config --global user.name "XEDY Cloud Scraper"
          git config --global user.email "cloud-scraper@xedy.trading"
          
          # Create a separate temporary folder for generated data
          mkdir -p temp_data/data
          cp data/news_feed.json temp_data/data/ || true
          cp data/qwen_decisions_log.jsonl temp_data/data/ || true
          cp data/self_learning_feedback.json temp_data/data/ || true
          cp data/closed_trades.json temp_data/data/ || true
          cp data/keyword_impact_memory.json temp_data/data/ || true
          cp data/forecast_accuracy_stats.json temp_data/data/ || true
          
          # Switch to data-feed branch (create if not exists)
          git checkout -B data-feed
          
          # Clean repository files except the generated data
          rm -rf backend frontend docs models tests .github
          mv temp_data/data .
          rm -rf temp_data
          
          # Commit and force push to prevent main branch bloat
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Deploy cloud news feed and self-learning updates" && git push -f origin data-feed)
