name: Cloud Backtest Engine

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backtest'
        required: true
        default: '30'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tvdatafeed pandas python-dotenv
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Backtest & Forecast
      env:
        AIVENE_API_KEY: ${{ secrets.AIVENE_API_KEY }}
      run: |
        python backend/scripts/backtest_forecast.py
